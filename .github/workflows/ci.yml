name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Verify Java modules
        run: ./backend/mvnw -f backend/pom.xml verify
      - name: Export deterministic fixture feed
        run: >-
          java -jar backend/radar-collector/target/radar-collector-1.0.0-SNAPSHOT.jar
          --sources=config/sources.yml
          --scoring=config/scoring.yml
          --fixture-dir=data/fixtures/sources
          --output-dir=build/fixture-data
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend quality gates
        working-directory: frontend
        env:
          RADAR_DATA_DIR: ../build/fixture-data
        run: |
          pnpm validate:data
          pnpm lint
          pnpm test
          pnpm build
      - name: Mobile browser smoke tests
        working-directory: frontend
        run: |
          pnpm exec playwright install --with-deps chromium webkit
          pnpm test:e2e
